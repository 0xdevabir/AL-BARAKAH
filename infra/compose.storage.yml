# Stateful services. Ports bind to localhost only; on a VPS only nginx is public.
services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: albarakah
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: albarakah
    ports: ["127.0.0.1:55432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U albarakah"], interval: 3s, timeout: 3s, retries: 20 }
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:56379:6379"]
    volumes: [redisdata:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 3s, timeout: 3s, retries: 20 }
  # S3-compatible object storage. The API only speaks S3, so this can be swapped for any S3 service.
  # The binary is called directly: the image's /entrypoint.sh fails on arm64 ("exec format error").
  objectstore:
    image: chrislusf/seaweedfs:4.50
    restart: unless-stopped
    entrypoint: ["/usr/bin/weed"]
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-volume.max=5"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?set in .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set in .env}
    ports: ["127.0.0.1:59000:8333"]
    volumes: [objectdata:/data]
volumes: { pgdata: {}, redisdata: {}, objectdata: {} }
