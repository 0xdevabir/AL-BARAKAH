# Optional heavy stack overlays on compose.app.yml when a small VPS is no longer enough.
# Usage:
#   COMPOSE_FILE=infra/compose.storage.yml:infra/compose.app.yml:infra/compose.full.yml
#
# Adds PgBouncer, a dedicated worker process, and (with --profile local-s3) SeaweedFS.
# Prefer the lite defaults in compose.app.yml + R2 until measurements say otherwise.

services:
  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p1
    restart: unless-stopped
    mem_limit: 64m
    environment:
      DB_HOST: postgres
      DB_USER: albarakah
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      DB_NAME: albarakah
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "40"
      LISTEN_PORT: "5432"
    depends_on:
      postgres: { condition: service_healthy }

  core:
    environment:
      DATABASE_URL: postgresql://albarakah:${POSTGRES_PASSWORD}@pgbouncer:5432/albarakah
      SERVICE_ROLE: api
    depends_on:
      migrate: { condition: service_completed_successfully }
      pgbouncer: { condition: service_started }
      redis: { condition: service_healthy }

  auth:
    environment:
      DATABASE_URL: postgresql://albarakah:${POSTGRES_PASSWORD}@pgbouncer:5432/albarakah
    depends_on:
      migrate: { condition: service_completed_successfully }
      pgbouncer: { condition: service_started }
      redis: { condition: service_healthy }

  worker:
    image: albarakah-app:${APP_VERSION:-local}
    restart: unless-stopped
    init: true
    mem_limit: 384m
    env_file: ${ENV_FILE:-../.env}
    command: ["node", "apps/core-service/dist/main.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://albarakah:${POSTGRES_PASSWORD}@pgbouncer:5432/albarakah
      REDIS_URL: redis://redis:6379
      NODE_OPTIONS: --max-old-space-size=256
      PORT: "4000"
      SERVICE_ROLE: worker
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:4000/health"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      pgbouncer: { condition: service_started }
      redis: { condition: service_healthy }
