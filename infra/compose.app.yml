# Application stack. Use together with compose.storage.yml (see docs/runbook.md).
#
# Lite production (default): R2 for files, no pgbouncer, core runs API + jobs.
#   edge ─┬─ /api/*  → gateway:4000 ─┬─ /auth, /admin/sms → auth:4010
#         │                           └─ everything else  → core:4020 (SERVICE_ROLE=all)
#         ├─ store domain → store:3000 (Next)
#         └─ staff domain → staff:3001 (Next)
#
# Heavy split (pgbouncer + dedicated worker + SeaweedFS) lives in compose.full.yml
# if you outgrow a small VPS.
x-backend: &backend
  image: albarakah-app:${APP_VERSION:-local}
  restart: unless-stopped
  # Node as PID 1 ignores SIGTERM, so every stop/redeploy waited out the 10s kill timeout. tini forwards it.
  init: true
  env_file: ${ENV_FILE:-../.env}
  environment: &backend-env
    NODE_ENV: production
    DATABASE_URL: postgresql://albarakah:${POSTGRES_PASSWORD}@postgres:5432/albarakah
    REDIS_URL: redis://redis:6379
    # Cap heap so six Node containers don't fight over a small VPS.
    NODE_OPTIONS: --max-old-space-size=256
    PORT: "4000"
  mem_limit: 384m

# Probes use busybox wget: `node -e fetch(...)` started a whole Node process every 10s in each
# of six containers, which is real CPU and memory on a small VPS or a laptop.
x-health: &health
  interval: 10s
  timeout: 5s
  retries: 6
  start_period: 20s

x-web: &web
  image: albarakah-app:${APP_VERSION:-local}
  restart: unless-stopped
  init: true
  mem_limit: 384m
  environment: &web-env
    NODE_ENV: production
    # Docker sets HOSTNAME to the container id; Next would then listen on that alone.
    HOSTNAME: 0.0.0.0
    API_INTERNAL_URL: http://gateway:4000
    NODE_OPTIONS: --max-old-space-size=256

services:
  # Runs once per deploy, straight to Postgres because migrations need a session of their own.
  migrate:
    <<: *backend
    restart: "no"
    mem_limit: 512m
    working_dir: /app/libs/database
    command: ["sh", "-c", "pnpm exec prisma migrate deploy && node dist/bootstrap.js"]
    environment:
      <<: *backend-env
      NODE_OPTIONS: --max-old-space-size=384
    depends_on:
      postgres: { condition: service_healthy }

  auth:
    <<: *backend
    command: ["node", "apps/auth-service/dist/main.js"]
    environment:
      <<: *backend-env
      PORT: "4010"
    healthcheck:
      <<: *health
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:4010/health"]
    depends_on: &ready
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  # API + BullMQ workers in one process (SERVICE_ROLE=all). Split again via compose.full.yml when load justifies it.
  core:
    <<: *backend
    command: ["node", "apps/core-service/dist/main.js"]
    environment:
      <<: *backend-env
      PORT: "4020"
      SERVICE_ROLE: all
    healthcheck:
      <<: *health
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:4020/health"]
    depends_on: *ready

  gateway:
    image: albarakah-app:${APP_VERSION:-local}
    restart: unless-stopped
    init: true
    mem_limit: 192m
    command: ["node", "apps/gateway/dist/main.js"]
    environment:
      NODE_ENV: production
      PORT: "4000"
      AUTH_SERVICE_URL: http://auth:4010
      CORE_SERVICE_URL: http://core:4020
      NODE_OPTIONS: --max-old-space-size=128
    healthcheck:
      <<: *health
      start_period: 10s
      # Goes through to core, so "healthy" means the whole API path answers.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:4000/health"]
    depends_on:
      auth: { condition: service_healthy }
      core: { condition: service_healthy }

  store:
    <<: *web
    working_dir: /app/web/store/.next/standalone
    command: ["node", "web/store/server.js"]
    environment:
      <<: *web-env
      PORT: "3000"
    healthcheck:
      <<: *health
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/favicon.svg"]
    depends_on:
      gateway: { condition: service_healthy }

  staff:
    <<: *web
    working_dir: /app/web/staff/.next/standalone
    command: ["node", "web/staff/server.js"]
    environment:
      <<: *web-env
      PORT: "3001"
    healthcheck:
      <<: *health
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3001/favicon.svg"]
    depends_on:
      gateway: { condition: service_healthy }

  # EDGE_MODE picks the server blocks in infra/nginx/<mode>:
  #   tls     — owns 80/443 and terminates TLS itself (a server with nothing else on it).
  #   proxied — plain HTTP behind a host nginx that already owns 80/443. Set
  #             EDGE_HTTP_PORT=127.0.0.1:8080 and EDGE_HTTPS_PORT=127.0.0.1:8443 so nothing
  #             public is bound (see docs/runbook.md).
  #   http    — local smoke test only.
  # With R2 there is no files domain; only store + staff are routed here.
  edge:
    image: albarakah-edge:${APP_VERSION:-local}
    restart: unless-stopped
    mem_limit: 64m
    environment:
      STORE_DOMAIN: ${STORE_DOMAIN:?set in .env}
      STAFF_DOMAIN: ${STAFF_DOMAIN:?set in .env}
    volumes:
      - ./nginx/shared:/etc/nginx/shared:ro
      - ./nginx/${EDGE_MODE:-tls}:/etc/nginx/templates:ro
      - ${CERT_DIR:-/etc/letsencrypt}:/etc/letsencrypt:ro
      - ${ACME_DIR:-/var/www/acme}:/var/www/acme:ro
    ports: ["${EDGE_HTTP_PORT:-80}:80", "${EDGE_HTTPS_PORT:-443}:443"]
    depends_on:
      gateway: { condition: service_healthy }
      store: { condition: service_healthy }
      staff: { condition: service_healthy }
