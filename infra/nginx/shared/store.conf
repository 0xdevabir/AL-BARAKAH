# Overwriting X-Forwarded-For (rather than appending) stops clients spoofing an address past the rate limits.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $remote_addr;
# $fwd_proto comes from the mode's template: $scheme, or the host proxy's header in proxied mode.
proxy_set_header X-Forwarded-Proto $fwd_proto;
proxy_set_header X-Request-Id $request_id;
client_max_body_size 1m;

# Live order updates must not be buffered.
location ~ ^/api/orders/.*/stream$ {
  rewrite ^/api/(.*)$ /$1 break;
  proxy_pass http://gateway_upstream;
  proxy_buffering off;
  proxy_read_timeout 1h;
}

location /api/ {
  proxy_pass http://gateway_upstream/;
  proxy_read_timeout 35s;
}
