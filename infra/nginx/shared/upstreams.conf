upstream gateway_upstream {
  server gateway:4000;
  keepalive 64;
}
upstream auth_upstream {
  server auth:4010;
  keepalive 32;
}
upstream core_upstream {
  server core:4020;
  keepalive 64;
}
upstream store_upstream {
  server store:3000;
  keepalive 64;
}
upstream staff_upstream {
  server staff:3001;
  keepalive 64;
}

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_types application/json text/css application/javascript image/svg+xml;
server_tokens off;
