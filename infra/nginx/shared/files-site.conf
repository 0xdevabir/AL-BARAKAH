# Signed URLs include the host, so it must reach storage unchanged.
client_max_body_size 11m;

location / {
  if ($request_method = OPTIONS) {
    add_header Access-Control-Allow-Origin $files_cors_origin always;
    add_header Access-Control-Allow-Methods "GET, PUT" always;
    add_header Access-Control-Allow-Headers "content-type" always;
    add_header Access-Control-Max-Age 3600 always;
    add_header Vary Origin always;
    return 204;
  }
  proxy_hide_header Access-Control-Allow-Origin;
  add_header Access-Control-Allow-Origin $files_cors_origin always;
  add_header Vary Origin always;
  proxy_set_header Host $http_host;
  proxy_request_buffering off;
  proxy_pass http://objectstore:8333;
}
