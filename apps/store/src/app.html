<!doctype html>
<html lang="%paraglide.lang%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f1f1f1" />
    <script>
      try {
        var seen = sessionStorage.getItem('ab-intro') || matchMedia('(prefers-reduced-motion: reduce)').matches;
        document.documentElement.dataset.intro = seen ? '0' : '1';
      } catch (e) {
        document.documentElement.dataset.intro = '1';
      }
    </script>
    <link rel="preload" href="%sveltekit.assets%/fonts/geist.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
